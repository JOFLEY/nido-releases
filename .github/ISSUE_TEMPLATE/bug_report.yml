name: Reportar un fallo
description: Cuenta qué pasó al usar Nido para que pueda reproducirlo.
title: "[Fallo] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por probar Nido. No incluyas archivos personales, claves ni capturas con datos privados.
  - type: input
    id: version
    attributes:
      label: Versión de Nido
      description: Aparece en el menú de la bandeja del sistema.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrí...\n2. Arrastré...\n3. Ocurrió..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas y qué ocurrió
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Información adicional
      description: Si afecta a varios monitores, indica sus escalas. Adjunta una captura solo si no contiene datos privados.
    validations:
      required: false
